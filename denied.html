<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - MSM Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            background-attachment: fixed;
            background-size: 100% 100%;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(239, 68, 68, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 40% 40%, rgba(34, 197, 94, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 2rem;
            text-align: center;
            max-width: 625px;
            margin: 0 auto;
        }

        .icon-container {
            margin-bottom: 2rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .lock-icon {
            width: 64px;
            height: 64px;
            color: #ef4444;
        }

        .main-heading {
            font-size: 3rem;
            font-weight: 700;
            color: #ef4444;
            margin-bottom: 1rem;
            letter-spacing: -0.025em;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .subtitle {
            font-size: 1.25rem;
            color: #cbd5e1;
            margin-bottom: 2rem;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .dynamic-content {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2.5rem;
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .project-info {
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        .domain-info {
            font-size: 1rem;
            color: #94a3b8;
        }

        .highlight {
            color: #60a5fa;
            font-weight: 600;
        }

        .contact-info {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInUp 0.8s ease-out 0.8s both;
        }

        .contact-text {
            font-size: 1rem;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
        }

        .email-address {
            font-size: 1.125rem;
            color: #60a5fa;
            font-weight: 600;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        }



        .footer {
            padding: 2rem;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            animation: fadeIn 1s ease-out 1s both;
            margin-top: auto;
        }

        .footer-text {
            font-size: 0.875rem;
            color: #64748b;
            max-width: 500px;
            margin: 0 auto;
        }

        .developer-name {
            color: #60a5fa;
            font-weight: 600;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }

            .main-heading {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1.125rem;
            }

            .lock-icon {
                width: 60px;
                height: 60px;
            }



            .dynamic-content {
                padding: 1.25rem;
            }
        }

        @media (max-width: 480px) {
            .main-heading {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .container {
                padding: 1rem;
            }

            .footer {
                padding: 1.5rem;
            }
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Loading states */
        .loading {
            color: #94a3b8;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Icon -->
        <div class="icon-container">
            <!-- Heroicons Lock Closed Icon -->
            <svg class="lock-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
        </div>

        <!-- Main Heading -->
        <h1 class="main-heading">Access Denied</h1>

        <!-- Subtitle -->
        <p class="subtitle">You don't have permission to view this project on this domain.</p>

        <!-- Dynamic Content -->
        <div class="dynamic-content">
            <div class="project-info">
                Project: <span class="highlight" id="project-name">Loading...</span>
            </div>
            <div class="domain-info">
                Domain: <span class="highlight" id="domain-name">Loading...</span>
            </div>
        </div>

        <!-- Contact Information -->
        <div class="contact-info">
            <p class="contact-text">For access requests, contact:</p>
            <p><a class="email-address" href="mailto:muhammadmeluk@gmail.com">MuhammadMeluk@gmail.com</a></p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p class="footer-text">
            This project is owned and maintained by 
            <span class="developer-name">Muhammad Meluk</span>.
            <br>
            Unauthorized access is not permitted.
        </p>
    </footer>

    <script>
        // Function to get URL query parameters
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // Function to safely display text content
        function setTextContent(elementId, content, fallback = 'Not specified') {
            const element = document.getElementById(elementId);
            if (element) {
                element.textContent = content || fallback;
            }
        }

        // Removed button-related functions as they are no longer needed

        // Initialize page content when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Get query parameters
            const projectName = getQueryParam('project');
            const domainName = getQueryParam('domain') || window.location.hostname;

            // Update dynamic content
            setTextContent('project-name', projectName, 'MSM Portfolio');
            setTextContent('domain-name', domainName, window.location.hostname);
        });

        // Add smooth scroll behavior for better UX
        if ('scrollBehavior' in document.documentElement.style) {
            document.documentElement.style.scrollBehavior = 'smooth';
        }

    </script>
</body>
</html>
